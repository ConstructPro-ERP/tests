name: Tests CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-ci:
    uses: ConstructPro-ERP/infra/.github/workflows/tests-ci.yml@develop
    with:
      run_e2e: ${{ github.event_name == 'workflow_dispatch' }}
      frontend_base_url: ${{ vars.FRONTEND_BASE_URL }}
      api_base_url: ${{ vars.API_BASE_URL }}
      invoice_id: ${{ vars.E2E_INVOICE_ID }}
      project_id: ${{ vars.E2E_PROJECT_ID }}
      payment_amount: ${{ vars.E2E_PAYMENT_AMOUNT || '1' }}
    secrets: inherit
